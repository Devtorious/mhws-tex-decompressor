name: Release Build

on:
  push:
    branches:
      - '**'
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract crate version
        id: version
        run: |
          VERSION=$(sed -n 's/^version\s*=\s*"\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Failed to determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_suffix: ""
          - os: macos-14
            target: aarch64-apple-darwin
            binary_suffix: ""
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CARGO_TERM_COLOR: always
      BINARY_NAME: mhws-tex-decompressor

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --verbose --release

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Package (zip)
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import zipfile
          
          bin_path = pathlib.Path(os.environ["BIN_PATH"])
          out_path = pathlib.Path(os.environ["OUT_PATH"])
          out_path.parent.mkdir(parents=True, exist_ok=True)
          
          with zipfile.ZipFile(out_path, "w", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(bin_path, arcname=bin_path.name)
          
          print(f"Packed {bin_path} -> {out_path}")
          PY
        env:
          BIN_PATH: target/release/${{ env.BINARY_NAME }}${{ matrix.binary_suffix }}
          OUT_PATH: dist/${{ env.BINARY_NAME }}-${{ env.VERSION }}-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BINARY_NAME }}-${{ env.VERSION }}-${{ matrix.target }}
          path: dist/${{ env.BINARY_NAME }}-${{ env.VERSION }}-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/**/*.zip
          name: Release v${{ env.VERSION }}
          body: |
            ## ${{ github.ref_name }}

            ### Changes
            - Please fill in the changes
